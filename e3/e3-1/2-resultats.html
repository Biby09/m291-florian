<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Résultats · Focale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" id="piste-css" href="style.css">

</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="1-filtres.html">Focale<span class="logo-dot">.</span></a>
      <form class="search" role="search">
        <label for="q" class="visually-hidden">Rechercher un appareil</label>
        <input id="q" type="search" placeholder="Rechercher un appareil, une monture…">
      </form>
      <nav aria-label="Navigation principale">
        <a class="compare-link" href="3-comparaison.html">Comparateur <span class="badge" aria-label="3 appareils">3</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="screen" id="resultats" aria-labelledby="t-resultats">
      <div class="container">
        <p class="screen-label">2. Choix</p>
        <a class="back-link" href="1-filtres.html">← Retour aux filtres</a>
        <div class="section-head">
          <h1 id="t-resultats">Résultats</h1>
          <p class="count" id="compte"></p>
          <a class="btn btn-secondary" href="1-filtres.html">Filtres</a>
        </div>
        <p id="etat" class="etat" role="status"></p>
        <ul class="product-grid" id="liste-cartes"></ul>
        <!-- Dessin repris par app.js pour chaque carte -->
        <template id="modele-illustration"><svg class="camera-illu" viewBox="0 0 120 84" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M10 26 h26 l4 -12 h24 l4 12 h42 a6 6 0 0 1 6 6 v40 a6 6 0 0 1 -6 6 h-100 a6 6 0 0 1 -6 -6 v-40 a6 6 0 0 1 6 -6 z"/><path d="M84 26 v-6 h16 v6"/><circle cx="54" cy="52" r="23"/><circle cx="54" cy="52" r="16" stroke-width="2"/><circle cx="54" cy="52" r="9"/><path d="M4 36 h8 M4 62 h8" stroke-width="2.5"/></g><circle cx="54" cy="52" r="3.5" fill="currentColor"/><rect x="92" y="34" width="12" height="7" rx="1.5" fill="currentColor"/></svg></template>
        <div class="actions">
          <p class="result-count">3 appareils sélectionnés</p>
          <a class="btn btn-primary" href="3-comparaison.html">Comparer (3)</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>Focale · données mises à jour le 25.09.2026</p></div>
  </footer>
  <script src="../../app.js"></script>
</body>
</html>
